name: 功能建议
description: 提议与中文化、诊断、还原或贡献体验直接相关的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前流程为什么难用；不要只填写一个功能名称
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户操作、预期结果和可接受的替代方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Claude Code
        - Claude Desktop
        - Windows 启动器
        - 翻译语料与术语
        - 文档与贡献流程
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与兼容性
      description: 是否涉及管理员权限、进程、用户配置、网络、签名或上游文件
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 项目边界
      options:
        - label: 我已检查 ROADMAP 和支持矩阵，没有把“不支持”误认为缺陷
          required: true
        - label: 该建议不要求关闭系统安全功能或修改鉴权、凭证、计费、代理和遥测
          required: true
