name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "corpus/**"
      - "patchers/**"
      - "release/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/release_status.py"
      - "docs/support-matrix.md"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install '.[dev]'
          npm ci --ignore-scripts
      - name: Verify release tag and gates
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "${expected_tag}"
          fi
          echo "RELEASE_TAG=${expected_tag}" >> "${GITHUB_ENV}"
          python scripts/release_status.py --check
          python scripts/release_status.py --release-gate
      - name: Run complete test suite
        run: |
          python -m unittest discover -s tests -v
          python schema/validate.py corpus
          npm test
      - name: Build release package and checksum
        run: |
          npm pack --json > pack.json
          package_file="$(node -e "const pack=require('./pack.json'); process.stdout.write(pack[0].filename)")"
          sha256sum "${package_file}" > SHA256SUMS
          echo "PACKAGE_FILE=${package_file}" >> "${GITHUB_ENV}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; release is current."
            exit 0
          fi
          if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi
          gh release create "${RELEASE_TAG}" \
            "${PACKAGE_FILE}" \
            SHA256SUMS \
            --verify-tag \
            --title "claude-zh ${RELEASE_TAG}" \
            --notes-file docs/support-matrix.md

  report-failure:
    needs: release
    if: ${{ always() && needs.release.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: >-
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release pipeline failed: ${GITHUB_REF_NAME}"
          body="Release stopped before publication. Run: ${RUN_URL}"
          existing="$(
            gh issue list \
              --repo "${REPOSITORY}" \
              --state open \
              --search "\"${title}\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${REPOSITORY}" --body "${body}"
          else
            gh issue create \
              --repo "${REPOSITORY}" \
              --title "${title}" \
              --body "${body}"
          fi
