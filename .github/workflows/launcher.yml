name: Windows launcher

on:
  pull_request:
    paths:
      - ".github/workflows/launcher.yml"
      - "bin/**"
      - "corpus/**"
      - "launcher/**"
      - "package.json"
      - "package-lock.json"
      - "patchers/**"
      - "scripts/build_windows_launcher.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.421"
      - name: Install and test Node.js code
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build single-file launcher
        shell: pwsh
        run: .\scripts\build_windows_launcher.ps1
      - name: Smoke-test embedded runtime
        shell: pwsh
        run: |
          $launcher = ".\artifacts\claude-zh-windows-x64.exe"
          $versionOutput = & $launcher --launcher-version | Out-String
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch "payload-sha256") {
            throw "Launcher version probe failed."
          }
          $env:CLAUDE_ZH_LAUNCHER_CACHE = Join-Path $env:RUNNER_TEMP "claude-zh-cache"
          $helpOutput = & $launcher --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $helpOutput -notmatch "Usage:") {
            throw "Embedded Node.js help smoke test failed."
          }
          $ptyOutput = & $launcher --launcher-self-test | Out-String
          if ($LASTEXITCODE -ne 0 -or $ptyOutput -notmatch "PTY_OK") {
            throw "Embedded node-pty smoke test failed."
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-zh-windows-x64-${{ github.sha }}
          path: |
            artifacts/claude-zh-windows-x64.exe
            artifacts/SHA256SUMS.windows
          if-no-files-found: error
          retention-days: 14
